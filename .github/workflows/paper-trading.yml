name: RegimeShift paper trading

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 13-21 * * 1-5"

concurrency:
  group: regimeshift-paper-trading
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan-and-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_PAPER: "true"
      MARKET_DATA_MODE: alpaca
      ALPACA_CLI_ENABLED: "true"
      ACCOUNT_EQUITY: "100000"
      MAX_RISK_PER_TRADE_PCT: "0.01"
      MAX_POSITION_LOSS_DOLLARS: "1000"
      DEFENSIVE_RISK_CAP_DOLLARS: "500"
      STOP_LOSS_FRACTION: "0.50"
      ENABLE_PAPER_ORDERS: ${{ vars.ENABLE_PAPER_ORDERS == 'true' && 'true' || 'false' }}
      ENABLE_EXPLORATION_ORDERS: ${{ vars.ENABLE_EXPLORATION_ORDERS == 'true' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and Alpaca CLI
        run: |
          python -m pip install --disable-pip-version-check -e backend
          scripts/install-alpaca-cli.sh
      - name: Validate paper credentials and backtest evidence
        id: backtest
        shell: bash
        run: |
          if [[ -z "$ALPACA_API_KEY" || -z "$ALPACA_SECRET_KEY" ]]; then
            echo "Missing GitHub Actions secrets ALPACA_API_KEY or ALPACA_SECRET_KEY." >&2
            echo "Vercel environment variables are separate from GitHub repository secrets." >&2
            exit 2
          fi
          python scripts/verify_backtest_gate.py --github-output "$GITHUB_OUTPUT"
      - name: Run gated paper cycle
        shell: bash
        run: |
          set -o pipefail
          python scripts/scanner_runner.py --timeframe intraday | tee intraday-cycle.json
          daily_arguments=(--timeframe daily)
          if [[ "$ENABLE_PAPER_ORDERS" == "true" && "${{ steps.backtest.outputs.daily_production_gate }}" == "true" ]]; then
            daily_arguments+=(--execute)
          elif [[ "$ENABLE_PAPER_ORDERS" == "true" ]]; then
            echo "Daily paper entry remains preview-only because its holdout gate failed."
          fi
          if [[ "${{ steps.backtest.outputs.exploration_gate }}" != "true" ]]; then
            export ENABLE_EXPLORATION_ORDERS=false
          fi
          python scripts/scanner_runner.py "${daily_arguments[@]}" | tee daily-cycle.json
      - name: Upload inspectable decision receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-cycle-${{ github.run_id }}
          path: |
            intraday-cycle.json
            daily-cycle.json
          if-no-files-found: ignore
          retention-days: 30
