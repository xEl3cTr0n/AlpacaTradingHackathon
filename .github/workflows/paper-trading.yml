name: RegimeShift paper trading

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 13-21 * * 1-5"

concurrency:
  group: regimeshift-paper-trading
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan-and-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_PAPER: "true"
      MARKET_DATA_MODE: alpaca
      ALPACA_CLI_ENABLED: "true"
      ENABLE_PAPER_ORDERS: ${{ vars.ENABLE_PAPER_ORDERS == 'true' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and Alpaca CLI
        run: |
          python -m pip install --disable-pip-version-check -e backend
          scripts/install-alpaca-cli.sh
      - name: Run gated paper cycle
        shell: bash
        run: |
          arguments=()
          if [[ "$ENABLE_PAPER_ORDERS" == "true" ]]; then
            arguments+=(--execute)
          fi
          python scripts/scanner_runner.py "${arguments[@]}"
